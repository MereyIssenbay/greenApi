<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GREEN-API Test Page</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17221b;
      background: #eef3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(320px, 1fr);
      gap: 24px;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    section {
      background: #ffffff;
      border: 1px solid #d7e2db;
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 12px 32px rgba(24, 52, 36, 0.08);
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.2;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 24px;
    }

    h2 {
      margin: 24px 0 12px;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 6px;
      border: 1px solid #b8c8bf;
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
      background: #ffffff;
      color: #17221b;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 6px;
      padding: 12px 14px;
      background: #198754;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #157347;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .response-section {
      display: flex;
      min-height: calc(100vh - 48px);
      flex-direction: column;
    }

    .response-section h1 {
      margin-bottom: 12px;
    }

    #response {
      flex: 1;
      min-height: 520px;
      resize: none;
      font-family: Consolas, "Courier New", monospace;
      line-height: 1.45;
      background: #111815;
      color: #d9ffe8;
    }

    #response.error {
      color: #ffb4b4;
    }

    @media (max-width: 820px) {
      body {
        padding: 16px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .response-section {
        min-height: auto;
      }

      #response {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>GREEN-API</h1>

      <label for="idInstance">idInstance</label>
      <input id="idInstance" type="text" autocomplete="off" placeholder="1101000001">

      <label for="apiTokenInstance">ApiTokenInstance</label>
      <input id="apiTokenInstance" type="text" autocomplete="off" placeholder="Ваш токен">

      <button id="getSettingsButton" type="button">getSettings</button>
      <button id="getStateButton" type="button">getStateInstance</button>

      <h2>Отправка сообщения</h2>

      <label for="messagePhone">Номер телефона получателя</label>
      <input id="messagePhone" type="text" autocomplete="off" placeholder="77001234567">

      <label for="messageText">Текст сообщения</label>
      <textarea id="messageText" placeholder="Введите сообщение"></textarea>

      <button id="sendMessageButton" type="button">sendMessage</button>

      <h2>Отправка файла</h2>

      <label for="filePhone">Номер телефона получателя</label>
      <input id="filePhone" type="text" autocomplete="off" placeholder="77001234567">

      <label for="fileUrl">Ссылка на файл</label>
      <input id="fileUrl" type="url" autocomplete="off" placeholder="https://example.com/file.pdf">

      <button id="sendFileButton" type="button">sendFileByUrl</button>
    </section>

    <section class="response-section">
      <h1>Ответ</h1>
      <textarea id="response" readonly>Ответ API появится здесь.</textarea>
    </section>
  </main>

  <script>
    const fields = {
      idInstance: document.querySelector('#idInstance'),
      apiTokenInstance: document.querySelector('#apiTokenInstance'),
      messagePhone: document.querySelector('#messagePhone'),
      messageText: document.querySelector('#messageText'),
      filePhone: document.querySelector('#filePhone'),
      fileUrl: document.querySelector('#fileUrl')
    };

    const responseField = document.querySelector('#response');
    const getSettingsButton = document.querySelector('#getSettingsButton');
    const getStateButton = document.querySelector('#getStateButton');
    const sendMessageButton = document.querySelector('#sendMessageButton');
    const sendFileButton = document.querySelector('#sendFileButton');

    getSettingsButton.addEventListener('click', getSettings);
    getStateButton.addEventListener('click', getStateInstance);
    sendMessageButton.addEventListener('click', sendMessage);
    sendFileButton.addEventListener('click', sendFileByUrl);

    function getSettings() {
      callApi('getSettings', 'GET', null, getSettingsButton);
    }

    function getStateInstance() {
      callApi('getStateInstance', 'GET', null, getStateButton);
    }

    function sendMessage() {
      const phone = normalizePhone(fields.messagePhone.value);
      const message = fields.messageText.value.trim();

      if (!phone || !message) {
        showError('Заполните номер получателя и текст сообщения.');
        return;
      }

      callApi(
        'sendMessage',
        'POST',
        {
          chatId: `${phone}@c.us`,
          message
        },
        sendMessageButton
      );
    }

    function sendFileByUrl() {
      const phone = normalizePhone(fields.filePhone.value);
      const urlFile = fields.fileUrl.value.trim();

      if (!phone || !urlFile) {
        showError('Заполните номер получателя и ссылку на файл.');
        return;
      }

      callApi(
        'sendFileByUrl',
        'POST',
        {
          chatId: `${phone}@c.us`,
          urlFile,
          fileName: getFileName(urlFile)
        },
        sendFileButton
      );
    }

    async function callApi(apiMethod, httpMethod, body, button) {
      responseField.classList.remove('error');

      const idInstance = fields.idInstance.value.trim();
      const apiTokenInstance = fields.apiTokenInstance.value.trim();

      if (!idInstance || !apiTokenInstance) {
        showError('Заполните idInstance и ApiTokenInstance.');
        return;
      }

      const url = `https://api.green-api.com/waInstance${idInstance}/${apiMethod}/${apiTokenInstance}`;

      button.disabled = true;
      responseField.value = 'Отправляю запрос...';

      try {
        const fetchOptions = {
          method: httpMethod,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        };

        const response = await fetch(url, fetchOptions);
        const text = await response.text();
        const formatted = formatResponse(text);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText}\n${formatted}`);
        }

        responseField.value = formatted;
      } catch (error) {
        showError(error.message);
      } finally {
        button.disabled = false;
      }
    }

    function getFileName(urlFile) {
      try {
        const pathname = new URL(urlFile).pathname;
        const name = pathname.split('/').filter(Boolean).pop();
        return name || 'file';
      } catch {
        return 'file';
      }
    }

    function normalizePhone(input) {
      let phone = input.trim().replace('@c.us', '').replace(/\D/g, '');

      if (phone.length === 10) {
        phone = `7${phone}`;
      }

      if (phone.length === 11 && phone.startsWith('8')) {
        phone = `7${phone.slice(1)}`;
      }

      return phone;
    }

    function formatResponse(text) {
      try {
        return JSON.stringify(JSON.parse(text), null, 2);
      } catch {
        return text;
      }
    }

    function showError(message) {
      responseField.classList.add('error');
      responseField.value = message;
    }
  </script>
</body>
</html>
